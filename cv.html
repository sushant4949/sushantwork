<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sushant_Kumar_CV</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23d4002f%22/><text x=%2250%22 y=%2268%22 font-size=%2256%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22 font-style=%22italic%22>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cv.css">
</head>
<body>

<div class="cv-bar">
  <a href="./">← Back to site</a>
  <button type="button" id="cv-print">Save as PDF</button>
</div>

<!-- Everything below is filled in by js/cv.js from js/data.js, so the CV follows the website. -->
<main>
  <section class="sheet" id="page-1">
    <header class="cv-head">
      <img class="cv-photo" id="cv-photo" alt="">
      <div class="cv-id">
        <h1 id="cv-name"></h1>
        <p class="cv-role" id="cv-titles"></p>
        <p class="cv-pitch" id="cv-pitch"></p>
      </div>
      <ul class="cv-contact" id="cv-contact"></ul>
    </header>

    <div class="cv-body">
      <aside class="cv-side">
        <section>
          <h2>What I do</h2>
          <ul class="cv-do" id="cv-do"></ul>
        </section>
        <section>
          <h2>Education</h2>
          <ul class="cv-edu" id="cv-edu"></ul>
        </section>
      </aside>
      <div class="cv-main">
        <section>
          <h2>In numbers</h2>
          <ul class="cv-stats" id="cv-stats"></ul>
        </section>
        <section>
          <h2>Roles over the years</h2>
          <div class="cv-jobs" id="cv-roles-1"></div>
        </section>
      </div>
    </div>
  </section>

  <section class="sheet" id="page-2">
    <div class="cv-body">
      <aside class="cv-side">
        <section>
          <h2>Recognition</h2>
          <ul class="cv-ach" id="cv-ach"></ul>
        </section>
        <section>
          <h2>Skills</h2>
          <ul class="cv-skills" id="cv-skills"></ul>
        </section>
      </aside>
      <div class="cv-main">
        <section>
          <h2>Roles over the years <span>continued</span></h2>
          <div class="cv-jobs" id="cv-roles-2"></div>
        </section>
      </div>
    </div>
    <p class="cv-foot">More of my work at <a id="cv-site" href="#"></a></p>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/cv.js"></script>
</body>
</html>
